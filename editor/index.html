<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeServer</title>

    <link rel="stylesheet" href="/styles/main.css">
    <link rel="stylesheet" href="/styles/sidebar.css">
    <link rel="stylesheet" href="/styles/body.css">
</head>
<body>
    <aside>
        <div id="file-tree"></div>

        <!-- Hidden Template for sidebar items -->
        <template id="file-item-template">
            <div class="file-item">
                <img class="file-icon" src="" alt="" style="display: none;" />
                <span class="file-name"></span>
            </div>
        </template>
    </aside>

    <main>
        <div id="main-top">
            <p id="breadcrumbs">/home/faris/CodeServer/</p>
        </div>
        <div id="main-code"></div>
    </main>

    <!-- Monaco Editor -->

    <script src="https://unpkg.com/monaco-editor@0.45.0/min/vs/loader.js"></script>
    <script>
        require.config({
            paths: { 'vs': 'https://unpkg.com/monaco-editor@0.45.0/min/vs' }
        });
    </script>

    <!-- JavaScript scripts -->

    <script defer src="/scripts/editor.js"></script>
    <script defer src="/scripts/sidebar.js"></script>
</body>
</html>
